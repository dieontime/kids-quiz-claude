<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #FFF8EE; }
      .shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08)); }
      .label-lg { font-size: 22px; font-weight: 700; fill: #1F2937; }
      .label-sm { font-size: 14px; fill: #6B7280; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="800"/>

  <!-- Header -->
  <text x="48" y="60" font-size="32" font-weight="800" fill="#1F2937">Hi, Sparkle Cat! 👋</text>
  <g transform="translate(1080, 32)">
    <rect width="152" height="44" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/>
    <text x="76" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED">Log out</text>
  </g>

  <!-- Stats strip -->
  <g class="shadow" transform="translate(48, 96)">
    <rect width="1184" height="120" rx="20" fill="white"/>
    <line x1="296" y1="20" x2="296" y2="100" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="592" y1="20" x2="592" y2="100" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="888" y1="20" x2="888" y2="100" stroke="#E5E7EB" stroke-width="2"/>

    <text x="148" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">⭐ TOTAL STARS</text>
    <text x="148" y="92" text-anchor="middle" font-size="38" font-weight="900" fill="#F59E0B">95</text>

    <text x="444" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">🔥 STREAK</text>
    <text x="444" y="92" text-anchor="middle" font-size="38" font-weight="900" fill="#DC2626">3 days</text>

    <text x="740" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">🏆 BEST MODULE</text>
    <text x="740" y="92" text-anchor="middle" font-size="28" font-weight="900" fill="#7C3AED">Vehicles 84%</text>

    <text x="1036" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">📊 TODAY</text>
    <text x="1036" y="92" text-anchor="middle" font-size="38" font-weight="900" fill="#3B82F6">12 Q's</text>
  </g>

  <!-- Quick Start CTA -->
  <g class="shadow" transform="translate(48, 244)">
    <rect width="1184" height="84" rx="18" fill="url(#qGrad)"/>
    <defs>
      <linearGradient id="qGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7C3AED"/>
        <stop offset="1" stop-color="#EC4899"/>
      </linearGradient>
    </defs>
    <text x="40" y="42" font-size="22" font-weight="800" fill="white">Quick Start ⚡</text>
    <text x="40" y="68" font-size="14" fill="rgba(255,255,255,0.9)">10 random questions across all modules</text>
    <g transform="translate(1004, 18)">
      <rect width="160" height="48" rx="12" fill="white"/>
      <text x="80" y="31" text-anchor="middle" font-size="18" font-weight="800" fill="#7C3AED">Let's go →</text>
    </g>
  </g>

  <!-- Module list -->
  <text x="48" y="376" font-size="20" font-weight="800" fill="#1F2937">All modules</text>

  <!-- Each row: emoji | name | progress bar | play -->
  <g transform="translate(48, 400)">
    <!-- Math -->
    <g class="shadow" transform="translate(0, 0)">
      <rect width="1184" height="64" rx="14" fill="white"/>
      <text x="24" y="44" font-size="32">🔢</text>
      <text x="76" y="42" font-size="20" font-weight="700" fill="#1F2937">Math</text>
      <rect x="280" y="28" width="640" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="280" y="28" width="358" height="10" rx="5" fill="#3B82F6"/>
      <text x="940" y="40" font-size="14" font-weight="700" fill="#6B7280">28 / 50</text>
      <g transform="translate(1056, 14)">
        <rect width="104" height="36" rx="10" fill="#3B82F6"/>
        <text x="52" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="white">Play →</text>
      </g>
    </g>

    <!-- Animals -->
    <g class="shadow" transform="translate(0, 76)">
      <rect width="1184" height="64" rx="14" fill="white"/>
      <text x="24" y="44" font-size="32">🦁</text>
      <text x="76" y="42" font-size="20" font-weight="700" fill="#1F2937">Animals</text>
      <rect x="280" y="28" width="640" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="280" y="28" width="154" height="10" rx="5" fill="#16A34A"/>
      <text x="940" y="40" font-size="14" font-weight="700" fill="#6B7280">12 / 50</text>
      <g transform="translate(1056, 14)">
        <rect width="104" height="36" rx="10" fill="#16A34A"/>
        <text x="52" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="white">Play →</text>
      </g>
    </g>

    <!-- Science -->
    <g class="shadow" transform="translate(0, 152)">
      <rect width="1184" height="64" rx="14" fill="white"/>
      <text x="24" y="44" font-size="32">🔬</text>
      <text x="76" y="42" font-size="20" font-weight="700" fill="#1F2937">Science</text>
      <rect x="280" y="28" width="640" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="280" y="28" width="64" height="10" rx="5" fill="#F59E0B"/>
      <text x="940" y="40" font-size="14" font-weight="700" fill="#6B7280">5 / 50</text>
      <g transform="translate(1056, 14)">
        <rect width="104" height="36" rx="10" fill="#F59E0B"/>
        <text x="52" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="white">Play →</text>
      </g>
    </g>

    <!-- Vehicles -->
    <g class="shadow" transform="translate(0, 228)">
      <rect width="1184" height="64" rx="14" fill="white"/>
      <text x="24" y="44" font-size="32">🚗</text>
      <text x="76" y="42" font-size="20" font-weight="700" fill="#1F2937">Vehicles</text>
      <rect x="280" y="28" width="640" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="280" y="28" width="538" height="10" rx="5" fill="#DC2626"/>
      <text x="940" y="40" font-size="14" font-weight="700" fill="#6B7280">42 / 50</text>
      <g transform="translate(1056, 14)">
        <rect width="104" height="36" rx="10" fill="#DC2626"/>
        <text x="52" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="white">Play →</text>
      </g>
    </g>

    <!-- Grammar -->
    <g class="shadow" transform="translate(0, 304)">
      <rect width="1184" height="64" rx="14" fill="white"/>
      <text x="24" y="44" font-size="32">📚</text>
      <text x="76" y="42" font-size="20" font-weight="700" fill="#1F2937">Grammar</text>
      <rect x="280" y="28" width="640" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="280" y="28" width="102" height="10" rx="5" fill="#7C3AED"/>
      <text x="940" y="40" font-size="14" font-weight="700" fill="#6B7280">8 / 50</text>
      <g transform="translate(1056, 14)">
        <rect width="104" height="36" rx="10" fill="#7C3AED"/>
        <text x="52" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="white">Play →</text>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="640" y="770" text-anchor="middle" font-size="16" fill="#6B7280">
    Layout C — Stats-forward list: parent-friendly progress dashboard, all modules visible at a glance
  </text>
</svg>
