<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1280" height="800" fill="#FFF8EE"/>

  <!-- Header strip: progress + score -->
  <text x="60" y="56" font-size="22" font-weight="800" fill="#1E40AF">Question 3 of 10</text>
  <text x="1220" y="56" text-anchor="end" font-size="22" font-weight="800" fill="#1E40AF">Score: 2</text>

  <!-- Math question -->
  <text x="640" y="180" text-anchor="middle" font-size="56" font-weight="900" fill="#1F2937">What is 8 − 3?</text>

  <!-- 4-option grid (2x2). Math = blue accent. -->
  <g>
    <!-- A -->
    <rect x="180" y="240" width="420" height="120" rx="20" fill="white" stroke="#3B82F6" stroke-width="4"/>
    <text x="390" y="320" text-anchor="middle" font-size="40" font-weight="800" fill="#1D4ED8">4</text>

    <!-- B -->
    <rect x="680" y="240" width="420" height="120" rx="20" fill="white" stroke="#3B82F6" stroke-width="4"/>
    <text x="890" y="320" text-anchor="middle" font-size="40" font-weight="800" fill="#1D4ED8">5</text>

    <!-- C -->
    <rect x="180" y="380" width="420" height="120" rx="20" fill="white" stroke="#3B82F6" stroke-width="4"/>
    <text x="390" y="460" text-anchor="middle" font-size="40" font-weight="800" fill="#1D4ED8">6</text>

    <!-- D -->
    <rect x="680" y="380" width="420" height="120" rx="20" fill="white" stroke="#3B82F6" stroke-width="4"/>
    <text x="890" y="460" text-anchor="middle" font-size="40" font-weight="800" fill="#1D4ED8">7</text>
  </g>

  <!-- FeedbackFlash (correct shown) -->
  <g transform="translate(180, 540)">
    <rect width="920" height="160" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="4"/>
    <text x="32" y="50" font-size="28" font-weight="800" fill="#14532D">✓ Nice!</text>
    <text x="32" y="92" font-size="22" fill="#166534">8 take away 3 is 5</text>
    <!-- Next button: themed blue -->
    <g transform="translate(720, 56)">
      <rect width="172" height="64" rx="14" fill="#3B82F6"/>
      <text x="86" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="white">Next</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="640" y="755" text-anchor="middle" font-size="16" fill="#6B7280">
    Math quiz screen — blue accent borders on options + blue Next button (medium-depth theming)
  </text>
</svg>
